name: 🐞 Bug 反馈
description: 报告一个问题（编译 / 烧录 / 仿真 / 页面异常等）
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: 运行方式
      options:
        - 浏览器（pnpm dev / pnpm start）
        - 桌面端（Electron）
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 x64 / macOS 15 arm64 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: 开发板型号（如涉及硬件）
      placeholder: Arduino Uno / ESP32-DevKitC / Blue Pill / Pico
  - type: textarea
    id: logs
    attributes:
      label: 日志输出
      description: 环境中心或工作台输出面板中的日志
      render: shell
